set -g mouse on

# Make sure new panes are open in the same directory as the current window
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

set-option -g detach-on-destroy off
set -sg escape-time 1

set -g pane-base-index 1

# Start windows and panes numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# 1. Bulletproof True Color support for Neovim inside Windows Terminal + tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# 2. Main Status Bar Background/Foreground
set -g status-style "bg=#3c3836,fg=#ebdbb2"

# 3. Inactive Tabs (Windows) Styling
set-window-option -g window-status-style "bg=#3c3836,fg=#a89984"
set-window-option -g window-status-format " #I: #W "

# 4. Active Tab (Window) Styling - Gruvbox Yellow Accent!
set-window-option -g window-status-current-style "bg=#d79921,fg=#282828,bold"
set-window-option -g window-status-current-format " #I: #W "

# 5. Right side of the bar
set -g status-right "#[fg=#a89984,bg=#504945] %Y-%m-%d │ %H:%M "

