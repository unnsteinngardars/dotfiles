set -g mouse on

# Make sure new panes are open in the same directory as the current window
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

set-option -g detach-on-destroy off
set -sg escape-time 1

set -g pane-base-index 1

# Start windows and panes numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Use terminal defaults (makes background transparent/native)
set-option -g status-style bg=default,fg=default

# Style the inactive tabs (gray or dim text)
set-window-option -g window-status-style fg=brightblack,bg=default

# Style the active tab (bold text using your terminal's primary foreground)
set-window-option -g window-status-current-style fg=default,bold,bg=default

# Format how the tabs look (e.g., "1:bash | 2:vim")
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format " [#I:#W] "

# Clean up the left and right side info panels
set-option -g status-left ""
set-option -g status-right " %H:%M " # Only shows a minimal clock on the far right
